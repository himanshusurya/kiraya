name: release

# Push a tag like v0.2.0 -> builds both APKs (same signing key every time) and publishes
# a GitHub Release. The apps check releases/latest and offer the update.
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Version from tag
        id: v
        run: |
          V="${GITHUB_REF_NAME#v}"
          IFS=. read -r MA MI PA <<< "$V"
          echo "name=$V" >> "$GITHUB_OUTPUT"
          echo "code=$((MA * 10000 + MI * 100 + PA))" >> "$GITHUB_OUTPUT"
      - name: Signing key
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/kiraya.jks"
          for app in owner tenant; do
            printf 'storeFile=%s\nstorePassword=%s\nkeyAlias=%s\nkeyPassword=%s\n' \
              "$RUNNER_TEMP/kiraya.jks" "$KEYSTORE_PASSWORD" "$KEY_ALIAS" "$KEYSTORE_PASSWORD" > apps/$app/android/key.properties
          done
      - name: Test
        run: |
          flutter pub get
          (cd packages/core && flutter test)
          (cd apps/owner && flutter test)
          (cd apps/tenant && flutter test)
      - name: Build APKs
        env:
          DEFINES: >-
            --dart-define=SUPABASE_URL=${{ secrets.SUPABASE_URL }}
            --dart-define=SUPABASE_ANON_KEY=${{ secrets.SUPABASE_ANON_KEY }}
            --dart-define=GITHUB_REPO=${{ github.repository }}
        run: |
          mkdir out
          for app in owner tenant; do
            (cd apps/$app && flutter build apk --release $DEFINES \
              --build-name=${{ steps.v.outputs.name }} --build-number=${{ steps.v.outputs.code }})
            cp apps/$app/build/app/outputs/flutter-apk/app-release.apk out/kiraya-$app-${{ steps.v.outputs.name }}.apk
          done
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" out/*.apk --title "Kiraya $GITHUB_REF_NAME" --generate-notes
