name: backup

# Nightly encrypted database dump, kept as a workflow artifact for 30 days.
# Restore: gpg -d kiraya.sql.gz.gpg | gunzip | psql "$DB_URL"
on:
  schedule:
    - cron: '0 21 * * *' # 02:30 IST
  workflow_dispatch:

jobs:
  dump:
    runs-on: ubuntu-latest
    steps:
      - name: Install pg_dump 17
        run: |
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl -fsSo /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc https://www.postgresql.org/media/keys/ACCC4CF8.asc
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" | sudo tee /etc/apt/sources.list.d/pgdg.list
          sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client-17
      - name: Dump and encrypt
        env:
          DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          PASS: ${{ secrets.BACKUP_PASSPHRASE }}
        run: |
          /usr/lib/postgresql/17/bin/pg_dump "$DB_URL" --no-owner --no-privileges -n public -n storage | gzip > kiraya.sql.gz
          gpg --batch --yes --pinentry-mode loopback --passphrase "$PASS" -c -o kiraya.sql.gz.gpg kiraya.sql.gz
          rm kiraya.sql.gz
      - uses: actions/upload-artifact@v4
        with:
          name: kiraya-backup-${{ github.run_number }}
          path: kiraya.sql.gz.gpg
          retention-days: 30
